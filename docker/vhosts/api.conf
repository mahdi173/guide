<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /api/public
    RewriteEngine On

    <Directory /api/public>
        AllowOverride all
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/51-75-253-76-fr_prod_error.log
    CustomLog /var/log/apache2/51-75-253-76-fr_prod_access.log combined

</VirtualHost>
