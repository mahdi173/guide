fos_user:
    db_driver: orm # other valid values are 'mongodb' and 'couchdb'
    firewall_name: main
    user_class: App\Entity\User
    service:
        mailer: fos_user.mailer.twig_swift
    from_email:
        address: "admin@guidejournal.net"
        sender_name: "guide journal"

    resetting:
        email:
            template:   '@FOSUser/Resetting/email.html.twig'

    registration:
        confirmation:
            enabled:    true
            template:   '@FOSUser/Registration/email.html.twig'
        form:
            type: App\Form\RegistrationFormType

    profile:
        form:
            type: App\Form\ProfileFormType