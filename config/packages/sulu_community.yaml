sulu_community:
  webspaces:
    guidejournal:
      from: "%env(SULU_ADMIN_EMAIL)%"
      registration:
        activate_user: false
        auto_login: true # only available when activate_user is true
        email:
          subject: Registration
          admin_template: ~
        redirect_to: ?send=true
          # Profile
      profile:
        email:
          subject: Profile Updated
          admin_template: ~
        redirect_to: ~
        #type: App\Form\ProfileType
      password_reset:
        auto_login: true
        email:
          subject: Password Reset
          admin_template: ~
        redirect_to: ?send=true
