version: "3"
# First install : SETUP_DB=1 RUN_COMPOSE=1 RUN_YARN=1 DUMP_ROUTES=1 docker-compose up
# Simple Run : docker-compose up -d

services:
  web:
    build: docker
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      APP_KEY: kjcndjjksddwdwdw
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: guidejournal
      DB_USERNAME: guidejournal
      DB_PASSWORD: guidejournal
      RUN_COMPOSE: ${RUN_COMPOSE}
      SETUP_DB: ${SETUP_DB}
      RUN_YARN: ${RUN_YARN}
      DUMP_ROUTES: ${DUMP_ROUTES}
      INSTALL_FCK: ${INSTALL_FCK}
    depends_on:
      - mariadb
      - maildev
    ports:
      - 80:80
      - 8000:8000
    volumes:
      - ./docker/docker-entrypoint.sh:/docker-entrypoint.sh
      - ./docker/vhosts:/etc/apache2/sites-enabled
      - ./docker/envvars:/etc/apache2/envvars
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-php-custom.ini
      - .:/api:cached
    working_dir: /api
    user: ${CUID}:${CGID}

  mariadb:
    image: mysql:5.7.25
    environment:
      MYSQL_DATABASE: guidejournal
      MYSQL_USER: sa_eko
      MYSQL_PASSWORD: guidejournal
      MYSQL_ROOT_PASSWORD: guidejournal
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer
    restart: "no"
    ports:
      - 8080:8080
  maildev:
    image: djfarrelly/maildev:0.14.0
    restart: "no"
    ports:
      - 1080:80
  redis:
    image: redis:latest
    restart: always
    ports:
      - 6379:6379
volumes:
  db-data:
