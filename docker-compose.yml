version: '3'
services:
  php:
    container_name: guidejournal_php
    build: docker
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      APP_KEY: hkgfdfghjmklm
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: guidejournal
      DB_USERNAME: guidejournal
      DB_PASSWORD: guidejournal
    depends_on:
      - mariadb
      - maildev
      - elasticsearch
    ports:
      - 80:80
      - 8000:8000
    volumes:
      - ./docker/docker-entrypoint.sh:/docker-entrypoint.sh
      - ./docker/vhosts:/etc/apache2/sites-enabled
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-php-custom.ini
      - .:/api:cached
    working_dir: /api
    user: ${CUID}:${CGID}
    env_file:
      - .env.local

  elasticsearch:
    build:
      context: docker/elk/elasticsearch
    volumes:
      - ./var/data/elasticsearch:/usr/share/elasticsearch/data:cached
    environment:
      ES_JAVA_OPTS: "-Xmx256m -Xms256m"

  mariadb:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: guidejournal
      MYSQL_USER: guidejournal
      MYSQL_PASSWORD: guidejournal
      MYSQL_ROOT_PASSWORD: guidejournal
    volumes:
      - db-data:/var/lib/mysql
  adminer:
    image: adminer
    ports:
      - 8080:8080
  maildev:
    image: djfarrelly/maildev:0.14.0
    ports:
      - 1080:80
volumes:
  db-data:
